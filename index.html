<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Workout Timer</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111}
input[type=range]{accent-color:#8883EB;width:100%}
input[type=number]{-moz-appearance:textfield;outline:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input:focus{outline:none;border-color:rgba(255,255,255,0.28)!important}
select{outline:none;cursor:pointer}
select:focus{border-color:rgba(255,255,255,0.28)!important}
.ib{background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 9px;cursor:pointer;color:#666;font-size:17px;line-height:1;display:flex;align-items:center}
.ib:hover{border-color:rgba(255,255,255,0.22);color:#bbb}
.tog{display:flex;background:#1a1a1a;border-radius:7px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;flex-shrink:0}
.tbtn{padding:5px 12px;font-size:12px;font-weight:500;border:none;cursor:pointer;font-family:inherit}
.tab{padding:8px 0;font-size:14px;font-weight:500;background:transparent;border:none;cursor:pointer;font-family:inherit;flex:1;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="ti-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></symbol><symbol id="ti-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></symbol><symbol id="ti-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.026 9.61l-.95 -4.18a2 2 0 0 1 1.95 -2.43h8a2 2 0 0 1 2 2.43l-1 4.2"/><path d="M9.026 17.001h6"/><path d="M18.906 20.06a7.92 7.92 0 0 0 1 -5.33a8 8 0 1 0 -14.77 5.33a2 2 0 0 0 1.71 .94h10.36a2 2 0 0 0 1.7 -.94"/></symbol><symbol id="ti-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1"/><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415"/><path d="M16 5l3 3"/></symbol><symbol id="ti-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/></symbol><symbol id="ti-layout-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -2"/><path d="M4 16a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -2"/></symbol><symbol id="ti-list-numbers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6h9"/><path d="M11 12h9"/><path d="M12 18h8"/><path d="M4 16a2 2 0 1 1 4 0c0 .591 -.5 1 -1 1.5l-3 2.5h4"/><path d="M6 10v-6l-2 2"/></symbol><symbol id="ti-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"/></symbol><symbol id="ti-player-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12"/><path d="M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12"/></symbol><symbol id="ti-player-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8l-13 -8"/></symbol><symbol id="ti-player-skip-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14l12 -7l-12 -7"/><path d="M20 5l0 14"/></symbol><symbol id="ti-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></symbol><symbol id="ti-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></symbol><symbol id="ti-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></symbol><symbol id="ti-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l8 0"/><path d="M12 17l0 4"/><path d="M7 4l10 0"/><path d="M17 4v8a5 5 0 0 1 -10 0v-8"/><path d="M3 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></symbol><symbol id="ti-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6 -6l6 6"/></symbol><symbol id="ti-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></symbol><symbol id="ti-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></symbol><symbol id="ti-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/><path d="M16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2"/></symbol></svg>
<div id="root" style="background:#111;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif">
  <div style="display:flex;align-items:center;justify-content:center;height:100dvh;color:#444;font-size:14px">Loading…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef,createElement:h,Fragment}=React;

function Icon({name,style}){
  return h('svg',{width:'1em',height:'1em',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',style:{display:'inline-block',verticalAlign:'middle',...style}},
    h('use',{href:'#ti-'+name}));
}

// ── Colour tokens (dark scheme) ───────────────────────────────────────────────
const C={
  bg:'#111',s1:'#181818',s2:'#1e1e1e',inp:'#212121',
  b:'rgba(255,255,255,0.09)',bhi:'rgba(255,255,255,0.2)',
  t:'#f0f0f0',ts:'#888',tt:'#444',
  // primary violet
  a:'#8883EB',at:'#1a1a1a',
  // traditional tangerine
  tr:'#E0804A',trbg:'#2B1A0E',
  // circuit amber
  ci:'#D4A822',cibg:'#241A05',
  // rest / done / delete
  r:'#5BB8E8',g:'#3DAF60',danger:'#D94F4F',
  ring:'rgba(255,255,255,0.07)',
};

// ── Audio ────────────────────────────────────────────────────────────────────
let _ctx=null;
function actx(){if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();if(_ctx.state==='suspended')_ctx.resume();return _ctx;}
function tone(f,d,v=0.3,dl=0){try{const c=actx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='sine';const t=c.currentTime+dl;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d+0.05);}catch{}}
const SFX={cd:()=>tone(880,0.07,0.26),work:()=>{tone(1047,0.1,0.36);tone(1319,0.13,0.36,0.13)},rest:()=>tone(523,0.2,0.26),trans:()=>{tone(784,0.1,0.32);tone(988,0.1,0.32,0.13);tone(1175,0.18,0.32,0.27)},done:()=>{tone(880,0.13,0.36);tone(740,0.13,0.3,0.17);tone(587,0.28,0.26,0.34)}};

// ── Persistence ──────────────────────────────────────────────────────────────
const KEY='workout-timer';
function loadData(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):{routines:[],sessions:[],groups:[]};}catch{return{routines:[],sessions:[],groups:[]};}}
function saveData(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}}

// ── Helpers ───────────────────────────────────────────────────────────────────
const upsert=(arr,x,k='id')=>{const i=arr.findIndex(a=>a[k]===x[k]);return i>=0?arr.map(a=>a[k]===x[k]?x:a):[...arr,x];};
const uid=()=>Math.random().toString(36).slice(2,8);
const clone=x=>JSON.parse(JSON.stringify(x));
const fmt=s=>{const m=Math.floor(s/60);return m?`${m}:${String(s%60).padStart(2,'0')}`:String(s);};
const fmtL=s=>s===0?'None':s<60?`${s}s`:`${fmt(s)} min`;

const newTradEx=()=>({id:uid(),name:'',mode:'reps',reps:10,duration:60,sets:3,restBetweenSets:60,restAfterExercise:120});
const newCircEx=()=>({id:uid(),name:'',mode:'reps',reps:10,duration:60,restAfterExercise:120});
const newTradRoutine=()=>({id:uid(),title:'',mode:'traditional',exercises:[newTradEx()]});
const exLabel=(e,circ)=>{const n=e.name||'Exercise';return circ?n:`${n} ×${e.sets}`;};

// ── Sequence builders ─────────────────────────────────────────────────────────
function buildTradSeq(r){
  const steps=[];
  r.exercises.forEach((ex,ei)=>{
    const last=ei===r.exercises.length-1;
    for(let i=1;i<=ex.sets;i++){
      steps.push({type:'work',label:ex.name||'Exercise',info:ex.sets>1?`Set ${i} of ${ex.sets}`:null,timed:ex.mode==='time',dur:ex.mode==='time'?ex.duration:null,reps:ex.mode==='reps'?ex.reps:null});
      if(i<ex.sets&&ex.restBetweenSets>0)steps.push({type:'rest',label:'Rest',info:`Set ${i+1} of ${ex.sets} next`,dur:ex.restBetweenSets,timed:true});
    }
    if(!last&&ex.restAfterExercise>0)steps.push({type:'rest',label:'Rest',info:`Up next: ${r.exercises[ei+1]?.name||'next exercise'}`,dur:ex.restAfterExercise,timed:true});
  });
  return steps;
}
function buildCircSeq(r){
  const steps=[];
  const{rounds,restBetweenRounds,exercises:exs}=r;
  for(let rd=1;rd<=rounds;rd++){
    exs.forEach((ex,ei)=>{
      steps.push({type:'work',label:ex.name||'Exercise',info:rounds>1?`Round ${rd} of ${rounds}`:null,timed:ex.mode==='time',dur:ex.mode==='time'?ex.duration:null,reps:ex.mode==='reps'?ex.reps:null});
      if(ei<exs.length-1&&ex.restAfterExercise>0)steps.push({type:'rest',label:'Rest',info:`Up next: ${exs[ei+1]?.name||'next exercise'}`,dur:ex.restAfterExercise,timed:true});
    });
    if(rd<rounds&&restBetweenRounds>0)steps.push({type:'rest',label:`Round ${rd} complete`,info:`Round ${rd+1} of ${rounds} up next`,dur:restBetweenRounds,timed:true,isRoundRest:true});
  }
  return steps;
}
const buildSeq=r=>[{type:'prepare',label:'Get ready',timed:true,dur:5},...(r.mode==='circuit'?buildCircSeq(r):buildTradSeq(r))];

function estTotal(r){
  if(r.mode==='circuit'){
    const{rounds,restBetweenRounds,exercises:exs}=r;
    const oneRound=exs.reduce((t,ex,ei)=>{if(ex.mode==='time')t+=ex.duration;if(ei<exs.length-1)t+=ex.restAfterExercise;return t;},0);
    return oneRound*rounds+restBetweenRounds*(rounds-1);
  }
  return r.exercises.reduce((t,ex,ei)=>{if(ex.mode==='time')t+=ex.duration*ex.sets;if(ex.sets>1)t+=ex.restBetweenSets*(ex.sets-1);if(ei<r.exercises.length-1)t+=ex.restAfterExercise;return t;},0);
}

// ── Shared style objects ───────────────────────────────────────────────────────
const card={background:C.s2,border:`1px solid ${C.b}`,borderRadius:12,padding:'12px',display:'flex',flexDirection:'column',gap:10};
const PILL={fontSize:11,padding:'2px 10px',borderRadius:99,fontWeight:500,background:'rgba(255,255,255,0.05)',color:C.ts,border:`1px solid ${C.b}`};
const cbtn=p=>({flex:1,padding:'12px 0',background:p?C.a:'rgba(255,255,255,0.08)',border:p?'none':'1px solid rgba(255,255,255,0.15)',borderRadius:10,color:p?C.at:C.t,fontSize:15,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8});

// ── Atoms ─────────────────────────────────────────────────────────────────────
function Ring({progress,size=172,sw=10,color}){
  const r=(size-sw*2)/2,circ=2*Math.PI*r;
  return h('svg',{width:size,height:size,style:{transform:'rotate(90deg) scaleX(-1)',display:'block'}},
    h('circle',{cx:size/2,cy:size/2,r,fill:'none',style:{stroke:C.ring,strokeWidth:sw}}),
    h('circle',{cx:size/2,cy:size/2,r,fill:'none',style:{stroke:color,strokeWidth:sw,strokeDasharray:circ,strokeDashoffset:circ*(1-progress),strokeLinecap:'round',transition:'stroke-dashoffset 0.85s linear'}}));
}
function Stepper({value,onChange,min=1,max=99}){
  const[raw,setRaw]=useState(String(value));
  useEffect(()=>setRaw(String(value)),[value]);
  return h('div',{style:{display:'flex',alignItems:'center',gap:6}},
    h('button',{className:'ib',onClick:()=>onChange(Math.max(min,value-1)),style:{padding:'4px 8px',fontSize:15}},h(Icon,{name:'minus'})),
    h('input',{type:'number',value:raw,min,max,
      onChange:e=>setRaw(e.target.value),
      onBlur:()=>{const v=parseInt(raw);const clamped=isNaN(v)?min:Math.min(max,Math.max(min,v));onChange(clamped);setRaw(String(clamped));},
      style:{width:46,padding:'5px 4px',fontSize:15,fontWeight:600,borderRadius:7,border:`1px solid ${C.b}`,background:C.inp,color:C.t,textAlign:'center',fontFamily:'inherit'}}),
    h('button',{className:'ib',onClick:()=>onChange(Math.min(max,value+1)),style:{padding:'4px 8px',fontSize:15}},h(Icon,{name:'plus'})));
}
function SliderVal({value,onChange,max=300,color}){
  const[raw,setRaw]=useState(String(value));
  useEffect(()=>setRaw(String(value)),[value]);
  return h('div',{style:{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}},
    h('input',{type:'range',min:0,max,step:5,value,onChange:e=>onChange(+e.target.value)}),
    h('input',{type:'number',value:raw,min:0,max,
      onChange:e=>setRaw(e.target.value),
      onBlur:()=>{const v=parseInt(raw);const clamped=isNaN(v)?0:Math.min(max,Math.max(0,v));onChange(clamped);setRaw(String(clamped));},
      style:{width:46,padding:'4px 6px',fontSize:13,fontWeight:500,borderRadius:6,border:`1px solid ${C.b}`,background:C.inp,color:color||C.a,textAlign:'center',fontFamily:'inherit'}}));
}
function LR({label,right,muted}){
  return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}},
    h('span',{style:{fontSize:12,color:muted?C.tt:C.ts,whiteSpace:'nowrap'}},label),right);
}
function SL({text}){return h('span',{style:{fontSize:11,fontWeight:500,color:C.ts,textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:8}},text);}

function ExName({ex,idx,total,onChange,onRemove,onMoveUp,onMoveDown}){
  return h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
    h('span',{style:{fontSize:12,color:C.tt,minWidth:18,textAlign:'center',fontWeight:600}},idx+1),
    h('input',{value:ex.name,onChange:e=>onChange('name',e.target.value),placeholder:'Exercise name',style:{flex:1,padding:'7px 11px',fontSize:14,borderRadius:8,border:`1px solid ${C.b}`,background:C.inp,color:C.t}}),
    total>1&&h(Fragment,null,
      h('button',{className:'ib',onClick:onMoveUp,style:{padding:'5px 7px',opacity:idx===0?0.25:1,pointerEvents:idx===0?'none':'auto'}},h(Icon,{name:'chevron-up',style:{fontSize:14}})),
      h('button',{className:'ib',onClick:onMoveDown,style:{padding:'5px 7px',opacity:idx===total-1?0.25:1,pointerEvents:idx===total-1?'none':'auto'}},h(Icon,{name:'chevron-down',style:{fontSize:14}})),
      h('button',{className:'ib',onClick:onRemove,style:{padding:'5px 7px',color:C.danger}},h(Icon,{name:'x',style:{fontSize:14}}))));
}
function TypeRow({ex,onChange}){
  const[rawDur,setRawDur]=useState(String(ex.duration));
  useEffect(()=>setRawDur(String(ex.duration)),[ex.duration]);
  return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}},
    h('div',{className:'tog',style:{flexShrink:0}},
      h('button',{className:'tbtn',onClick:()=>onChange('mode','reps'),style:{background:ex.mode==='reps'?C.a:'transparent',color:ex.mode==='reps'?C.at:C.ts}},'Reps'),
      h('button',{className:'tbtn',onClick:()=>onChange('mode','time'),style:{background:ex.mode==='time'?C.a:'transparent',color:ex.mode==='time'?C.at:C.ts}},'Time')),
    ex.mode==='reps'
      ?h(Stepper,{value:ex.reps,onChange:v=>onChange('reps',v),min:1,max:999})
      :h('div',{style:{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}},
          h('input',{type:'range',min:5,max:300,step:5,value:ex.duration,onChange:e=>onChange('duration',+e.target.value),style:{flex:1,minWidth:0}}),
          h('input',{type:'number',value:rawDur,min:5,max:300,
            onChange:e=>setRawDur(e.target.value),
            onBlur:()=>{const v=parseInt(rawDur);const clamped=isNaN(v)?5:Math.min(300,Math.max(5,v));onChange('duration',clamped);setRawDur(String(clamped));},
            style:{width:46,padding:'4px 6px',fontSize:13,fontWeight:500,borderRadius:6,border:`1px solid ${C.b}`,background:C.inp,color:C.a,textAlign:'center',fontFamily:'inherit',flexShrink:0}})));
}

function EH({canSave,onSave,onBack,title}){
  return h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'1rem',borderBottom:`1px solid ${C.b}`,position:'sticky',top:0,background:C.bg,zIndex:10}},
    h('button',{className:'ib',onClick:onBack},h(Icon,{name:'arrow-left'})),
    h('h1',{style:{fontSize:18,fontWeight:600,flex:1,color:C.t}},title||'Edit'),
    h('button',{onClick:()=>canSave&&onSave(),disabled:!canSave,style:{padding:'7px 18px',background:canSave?C.a:'rgba(255,255,255,0.07)',border:'none',borderRadius:8,color:canSave?C.t:C.tt,fontSize:14,fontWeight:600,cursor:canSave?'pointer':'default'}},'Save'));
}

function TradEx({ex,idx,total,isLast,onChange,onRemove,onMoveUp,onMoveDown}){
  return h('div',{style:card},
    h(ExName,{ex,idx,total,onChange,onRemove,onMoveUp,onMoveDown}),
    h(TypeRow,{ex,onChange}),
    h(LR,{label:'Sets',right:h(Stepper,{value:ex.sets,onChange:v=>onChange('sets',v),min:1,max:20})}),
    ex.sets>1&&h(LR,{label:'Rest between sets',right:h(SliderVal,{value:ex.restBetweenSets,onChange:v=>onChange('restBetweenSets',v),color:C.r})}),
    !isLast&&h(LR,{label:'Rest before next',right:h(SliderVal,{value:ex.restAfterExercise,onChange:v=>onChange('restAfterExercise',v)}),muted:true}));
}
function CircEx({ex,idx,total,isLast,onChange,onRemove,onMoveUp,onMoveDown}){
  return h('div',{style:card},
    h(ExName,{ex,idx,total,onChange,onRemove,onMoveUp,onMoveDown}),
    h(TypeRow,{ex,onChange}),
    !isLast&&h(LR,{label:'Rest before next',right:h(SliderVal,{value:ex.restAfterExercise,onChange:v=>onChange('restAfterExercise',v)}),muted:true}));
}

const moveItem=(arr,i,dir)=>{const j=i+dir;if(j<0||j>=arr.length)return arr;const a=[...arr];[a[i],a[j]]=[a[j],a[i]];return a;};

// ── Mode colours helper ────────────────────────────────────────────────────────
const modeAccent=m=>m==='circuit'?C.ci:C.tr;
const modeBg=m=>m==='circuit'?C.cibg:C.trbg;

// ── Edit Routine ──────────────────────────────────────────────────────────────
function EditRoutineView({routine,groups,onSave,onBack}){
  const[r,setR]=useState(routine);
  const[groupId,setGroupId]=useState(()=>groups.find(g=>g.routineIds.includes(routine.id))?.id||null);
  const upEx=(id,f,v)=>setR(p=>({...p,exercises:p.exercises.map(e=>e.id===id?{...e,[f]:v}:e)}));
  const moveEx=(i,dir)=>setR(p=>{const a=moveItem(p.exercises,i,dir);return a===p.exercises?p:{...p,exercises:a};});

// ── Timer ─────────────────────────────────────────────────────────────────────
function TimerView({routine,onBack}){
  const seq=useRef(buildSeq(routine)).current;
  const[st,setSt]=useState({idx:0,tl:seq[0]?.dur||0,running:false,done:false});
  const ref=useRef(st);ref.current=st;
  const intRef=useRef(null);
  function goTo(ni){
    if(ni>=seq.length){SFX.done();clearInterval(intRef.current);setSt(s=>({...s,running:false,done:true,tl:0}));}
    else{const ns=seq[ni];if(ns.type==='rest')(ns.isRoundRest?SFX.trans:SFX.rest)();else SFX.work();setSt(s=>({...s,idx:ni,tl:ns.dur||0}));}
  }
  const wlRef=useRef(null);
  useEffect(()=>{
    if(!st.running||!navigator.wakeLock)return;
    const acquire=()=>navigator.wakeLock.request('screen').then(l=>wlRef.current=l).catch(()=>{});
    acquire();
    const onVis=()=>{if(document.visibilityState==='visible'&&ref.current.running)acquire();};
    document.addEventListener('visibilitychange',onVis);
    return()=>{
      document.removeEventListener('visibilitychange',onVis);
      if(wlRef.current){wlRef.current.release();wlRef.current=null;}
    };
  },[st.running]);
  useEffect(()=>{
    if(!st.running){clearInterval(intRef.current);return;}
    if(!seq[st.idx]?.timed){clearInterval(intRef.current);return;}
    clearInterval(intRef.current);
    intRef.current=setInterval(()=>{
      const{idx,tl}=ref.current;
      const nt=tl-1;
      if(nt>0&&nt<=3)SFX.cd();
      if(nt<=0)goTo(idx+1);
      else setSt(s=>({...s,tl:nt}));
    },1000);
    return()=>clearInterval(intRef.current);
  },[st.running,st.idx]);
  function advance(){goTo(ref.current.idx+1);}
  const reset=()=>{clearInterval(intRef.current);setSt({idx:0,tl:seq[0]?.dur||0,running:false,done:false});};
  const{idx,tl,running,done}=st;
  const cur=seq[idx],nxt=seq[idx+1];
  const isPrepare=cur?.type==='prepare';
  const isRest=cur?.type==='rest',isTimed=cur?.timed;
  const toggle=()=>{if(!st.running&&!isPrepare)SFX.work();setSt(s=>({...s,running:!s.running}));};
  const accent=done?C.g:isPrepare?C.ts:isRest?C.r:C.a;
  const tt=useRef(seq.filter(s=>s.timed&&s.dur&&s.type!=='prepare').reduce((a,s)=>a+s.dur,0)).current;
  const td=seq.slice(0,idx).filter(s=>s.timed&&s.dur&&s.type!=='prepare').reduce((a,s)=>a+s.dur,0)+(cur?.timed&&cur?.dur&&!isPrepare?cur.dur-tl:0);
  const op=tt>0?Math.min(1,td/tt):0;
  const visLen=seq.length-1;
  const ll=cur?.label?.length??0;
  const ns=ll>18?17:ll>12?21:26;
  const nl=nxt?(nxt.type==='rest'?`Rest · ${fmtL(nxt.dur)}`:nxt.reps?`${nxt.label} · ${nxt.reps} reps`:`${nxt.label} · ${fmtL(nxt.dur)}`):null;
  return h('div',{style:{maxWidth:420,margin:'0 auto',display:'flex',flexDirection:'column',minHeight:'100dvh'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'1rem',borderBottom:`1px solid ${C.b}`}},
      h('button',{className:'ib',onClick:onBack},h(Icon,{name:'arrow-left'})),
      h('p',{style:{flex:1,fontWeight:600,fontSize:15,color:C.t}},routine.title||'Routine'),
      h('span',{style:{fontSize:12,color:C.tt}},isPrepare?'–':`${idx} / ${visLen}`)),
    tt>0&&h('div',{style:{height:2,background:'rgba(255,255,255,0.06)'}},
      h('div',{style:{height:'100%',background:accent,width:`${op*100}%`,transition:'width 0.8s linear'}})),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'2rem 1rem',gap:'1rem'}},
      done
        ?h('div',{style:{textAlign:'center',width:'100%'}},
            h(Icon,{name:'trophy',style:{fontSize:56,color:C.g,display:'block',margin:'0 auto 16px'}}),
            h('h2',{style:{fontSize:22,fontWeight:600,color:C.t,marginBottom:8}},'Routine complete!'),
            h('p',{style:{fontSize:14,color:C.ts}},routine.title||'Great work!'))
        :h(Fragment,null,
            cur?.info&&h('p',{style:{fontSize:13,color:C.tt,letterSpacing:'0.02em'}},cur.info),
            h('h2',{style:{fontSize:ns,fontWeight:600,textAlign:'center',color:isPrepare?C.ts:isRest?C.r:C.t,lineHeight:1.2,maxWidth:280}},cur?.label),
            isTimed
              ?h('div',{style:{position:'relative',display:'inline-flex',alignItems:'center',justifyContent:'center'}},
                  h(Ring,{progress:cur.dur?(running?Math.max(0,(tl-1)/cur.dur):tl/cur.dur):0,color:accent}),
                  h('div',{style:{position:'absolute',textAlign:'center'}},
                    h('div',{style:{fontSize:46,fontWeight:600,color:C.t,lineHeight:1,fontFamily:'monospace'}},fmt(tl)),
                    h('div',{style:{fontSize:11,color:C.tt,marginTop:5,letterSpacing:'0.07em'}},tl<60?'SECONDS':'REMAINING')))
              :h('div',{style:{width:172,height:172,borderRadius:'50%',border:`10px solid ${accent}`,background:'rgba(136,131,235,0.08)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
                  h('div',{style:{fontSize:52,fontWeight:600,color:C.t,lineHeight:1}},cur?.reps),
                  h('div',{style:{fontSize:11,color:C.tt,marginTop:5,letterSpacing:'0.07em'}},'REPS')),
            nl&&!isPrepare&&h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 16px',background:C.s2,borderRadius:9,border:`1px solid ${C.b}`}},
              h('span',{style:{fontSize:11,color:C.tt,fontWeight:500,letterSpacing:'0.07em'}},'NEXT'),
              h('span',{style:{fontSize:13,color:C.ts}},nl)))),
    h('div',{style:{padding:'1rem',borderTop:`1px solid ${C.b}`,display:'flex',gap:8}},
      h('button',{className:'ib',onClick:reset,style:{padding:'12px 14px'}},h(Icon,{name:'refresh',style:{fontSize:18}})),
      !done&&isRest&&h('button',{onClick:advance,style:skipS},h(Icon,{name:'player-skip-forward',style:{fontSize:15}}),'Skip'),
      done
        ?h('button',{onClick:reset,style:cbtn(true)},'Go again')
        :isPrepare&&running
          ?h('button',{onClick:advance,style:cbtn(true)},h(Icon,{name:'player-skip-forward',style:{fontSize:15}}),'Skip')
          :!isTimed&&running
            ?h('button',{onClick:advance,style:cbtn(true)},h(Icon,{name:'check',style:{fontSize:18}}),'Done — next')
            :h('button',{onClick:toggle,style:cbtn(!running)},
                h(Icon,{name:running?'player-pause':'player-play',style:{fontSize:18}}),
                running?'Pause':idx===0&&!st.running?'Start':'Resume')));
}

  return h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
    h('div',{style:{background:C.s2,border:`1px solid ${C.b}`,borderRadius:10,padding:'8px 10px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:members.length>0?8:0}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}},
          h('button',{onClick:()=>{const next=!collapsed;setCollapsed(next);onToggleCollapse(next);},style:{background:'none',border:'none',cursor:'pointer',padding:'2px 4px',display:'flex',alignItems:'center',flexShrink:0}},
            h(Icon,{name:'chevron-down',style:{fontSize:14,color:C.ts,transform:collapsed?'rotate(-90deg)':'rotate(0deg)',transition:'transform 0.2s'}})),
          editing
            ?h('input',{autoFocus:true,value:name,onChange:e=>setName(e.target.value),onBlur:commitName,
                onKeyDown:e=>{if(e.key==='Enter')commitName();if(e.key==='Escape'){setEditing(false);setName(group.title);}},
                style:{flex:1,background:'transparent',border:'none',borderBottom:`1px solid ${C.a}`,color:C.t,fontSize:16,fontWeight:600,outline:'none',padding:'1px 2px'}})
            :h('span',{onDoubleClick:()=>setEditing(true),style:{flex:1,fontSize:16,fontWeight:600,color:C.t,cursor:'text',userSelect:'none'}},group.title)),
        h('button',{className:'ib',title:'Delete group',onClick:()=>onDeleteGroup(group.id),style:{padding:'7px 9px',color:C.danger,borderColor:'rgba(217,79,79,0.3)',flexShrink:0}},
          h(Icon,{name:'trash',style:{fontSize:18}}))),
      members.length>0&&h('div',{style:{display:'flex',gap:5,flexWrap:'wrap'}},
        members.map(r=>h('span',{key:r.id,style:PILL},r.title||'Untitled')))),
    !collapsed&&h('div',{style:{display:'flex',flexDirection:'column',gap:6,paddingLeft:12,borderLeft:`2px solid ${C.b}`}},
      members.map(r=>h(RoutineCard,{key:r.id,r,sessions,onPlay,onEdit,onDuplicate,onDelete,onAddToSession})),
      members.length===0&&h('p',{style:{fontSize:12,color:C.tt,padding:'8px 4px',fontStyle:'italic'}},'Edit a routine and assign it to this group')));
}

// ── Home ──────────────────────────────────────────────────────────────────────
function HomeView({routines,sessions,groups,tab,setTab,onNewRoutine,onEditRoutine,onDuplicateRoutine,onDeleteRoutine,onPlayRoutine,onAddToSession,onNewSession,onEditSession,onDeleteSession,onOpenSession,onNewGroup,onRenameGroup,onDeleteGroup,onToggleCollapse,onReorderRoutines,onReorderGroups,onReorderSessions}){
  const[reordering,setReordering]=useState(false);
  const[menuOpen,setMenuOpen]=useState(false);
  const importRef=useRef(null);
  const groupedIds=groups.flatMap(g=>g.routineIds);
  const ungrouped=routines.filter(r=>!groupedIds.includes(r.id));

  const topItems=groups.map(g=>({type:'group',id:g.id,title:g.title})).concat(ungrouped.map(r=>({type:'routine',id:r.id,title:r.title})));

  function doExport(){
    const blob=new Blob([localStorage.getItem(KEY)||'{}'],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-timer.json';a.click();
    URL.revokeObjectURL(a.href);setMenuOpen(false);
  }
  function doImport(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{JSON.parse(ev.target.result);localStorage.setItem(KEY,ev.target.result);location.reload();}catch{alert('Invalid backup file.');}};
    reader.readAsText(file);setMenuOpen(false);
  }

  function moveTop(idx,dir){
    const moved=moveItem(topItems,idx,dir);
    const{newGroups,newUngrouped}=moved.reduce((acc,x)=>{
      if(x.type==='group')acc.newGroups.push(groups.find(g=>g.id===x.id));
      else acc.newUngrouped.push(ungrouped.find(r=>r.id===x.id));
      return acc;
    },{newGroups:[],newUngrouped:[]});
    onReorderGroups(newGroups);
    onReorderRoutines(newUngrouped,groupedIds);
  }

  return h('div',{style:{padding:'1.5rem 1rem 3rem',maxWidth:420,margin:'0 auto'}},
    menuOpen&&h('div',{onClick:()=>setMenuOpen(false),style:{position:'fixed',inset:0,zIndex:10}}),
    h('input',{type:'file',accept:'.json',ref:importRef,style:{display:'none'},onChange:doImport}),
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}},
      h('div',{style:{position:'relative'}},
        h('h1',{onClick:()=>setMenuOpen(o=>!o),style:{fontSize:22,fontWeight:600,color:C.t,cursor:'default',userSelect:'none'}},'Workout Timer'),
        menuOpen&&h('div',{style:{position:'absolute',top:'100%',left:0,marginTop:6,background:C.s2,border:`1px solid ${C.b}`,borderRadius:10,padding:'6px',zIndex:20,display:'flex',flexDirection:'column',gap:4,minWidth:160}},
          h('button',{onClick:doExport,style:{padding:'9px 14px',background:'transparent',border:'none',borderRadius:7,color:C.t,fontSize:14,cursor:'pointer',textAlign:'left',fontFamily:'inherit'}},'Export backup'),
          h('button',{onClick:()=>{importRef.current.click();},style:{padding:'9px 14px',background:'transparent',border:'none',borderRadius:7,color:C.t,fontSize:14,cursor:'pointer',textAlign:'left',fontFamily:'inherit'}},'Import backup'))),
      h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
        reordering
          ?h('button',{onClick:()=>setReordering(false),style:{padding:'7px 16px',background:C.a,border:'none',borderRadius:8,color:'#1a1a1a',fontSize:14,fontWeight:600,cursor:'pointer'}},'Done')
          :h(Fragment,null,
              (tab==='routines'?(groups.length+ungrouped.length)>1:sessions.length>1)&&h('button',{onClick:()=>setReordering(true),style:{padding:'7px 14px',background:'transparent',border:`1px solid ${C.b}`,borderRadius:8,color:C.ts,fontSize:14,fontWeight:500,cursor:'pointer'}},'Reorder'),
              h('button',{className:'ib',onClick:tab==='routines'?onNewRoutine:onNewSession,style:{padding:'8px 14px',gap:6,color:C.t,borderColor:C.bhi}},
                h(Icon,{name:'plus',style:{fontSize:15}}),' New')))),
    h('div',{style:{display:'flex',borderBottom:`1px solid ${C.b}`}},
      h('button',{className:'tab',onClick:()=>{setReordering(false);setTab('routines');},style:tabStyle(tab==='routines')},`Routines (${routines.length})`),
      h('button',{className:'tab',onClick:()=>{setReordering(false);setTab('sessions');},style:tabStyle(tab==='sessions')},`Sessions (${sessions.length})`)),
    tab==='routines'&&!reordering&&h('div',{style:{display:'flex',borderBottom:`1px solid ${C.b}`,marginBottom:'1.25rem'}},
      h('button',{onClick:onNewGroup,style:{flex:1,padding:'8px 0',background:'transparent',border:'none',color:C.tt,fontSize:12,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:5,letterSpacing:'0.03em'}},
        h(Icon,{name:'plus',style:{fontSize:12}}),'New Group')),
    tab==='routines'
      ?(routines.length===0
          ?h('div',{style:{textAlign:'center',padding:'5rem 1rem'}},
              h(Icon,{name:'dumbbell',style:{fontSize:48,display:'block',marginBottom:16,opacity:0.18,color:C.t}}),
              h('p',{style:{fontSize:15,fontWeight:500,color:C.t,marginBottom:4}},'No routines yet'),
              h('p',{style:{fontSize:13,color:C.ts}},'Tap "New" to build your first routine'))
          :reordering
            ?h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
                topItems.map((item,i)=>{
                  const isGroup=item.type==='group';
                  return h('div',{key:item.id,style:{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:isGroup?C.s2:C.s1,border:`1px solid ${C.b}`,borderRadius:isGroup?10:12}},
                    h('span',{style:{flex:1,fontSize:15,fontWeight:600,color:C.t}},item.title||'Untitled'),
                    h('button',{...updownBtn(()=>moveTop(i,-1),i===0)},h(Icon,{name:'chevron-up',style:{fontSize:16}})),
                    h('button',{...updownBtn(()=>moveTop(i,1),i===topItems.length-1)},h(Icon,{name:'chevron-down',style:{fontSize:16}})));
                }))
            :h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
                groups.map(g=>h(GroupRow,{key:g.id,group:g,routines,sessions,
                  onPlay:onPlayRoutine,onEdit:onEditRoutine,onDuplicate:onDuplicateRoutine,onDelete:onDeleteRoutine,onAddToSession,
                  onRenameGroup,onDeleteGroup,
                  onToggleCollapse:v=>onToggleCollapse(g.id,v)})),
                ungrouped.map(r=>h(RoutineCard,{key:r.id,r,sessions,
                  onPlay:onPlayRoutine,onEdit:onEditRoutine,onDuplicate:onDuplicateRoutine,onDelete:onDeleteRoutine,onAddToSession}))))
      :(sessions.length===0
          ?h('div',{style:{textAlign:'center',padding:'5rem 1rem',marginTop:'1.25rem'}},
              h(Icon,{name:'layout-list',style:{fontSize:48,display:'block',marginBottom:16,opacity:0.18,color:C.t}}),
              h('p',{style:{fontSize:15,fontWeight:500,color:C.t,marginBottom:4}},'No sessions yet'),
              h('p',{style:{fontSize:13,color:C.ts}},'Tap "New" to build your first session'))
          :reordering
            ?h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginTop:'1.25rem'}},
                sessions.map((s,i)=>h('div',{key:s.id,style:{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:C.s1,border:`1px solid ${C.b}`,borderRadius:12}},
                  h('span',{style:{flex:1,fontSize:15,fontWeight:600,color:C.t}},s.name||'Untitled Session'),
                  h('button',{...updownBtn(()=>onReorderSessions(moveItem(sessions,i,-1)),i===0)},h(Icon,{name:'chevron-up',style:{fontSize:16}})),
                  h('button',{...updownBtn(()=>onReorderSessions(moveItem(sessions,i,1)),i===sessions.length-1)},h(Icon,{name:'chevron-down',style:{fontSize:16}})))))            :h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginTop:'1.25rem'}},
                sessions.map(s=>h(SessionCard,{key:s.id,s,routines,onOpen:()=>onOpenSession(s),onEdit:onEditSession,onDelete:onDeleteSession})))));
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[routines,setRoutines]=useState([]);
  const[sessions,setSessions]=useState([]);
  const[groups,setGroups]=useState([]);
  const[view,setView]=useState('home');
  const[editingRoutine,setEditingRoutine]=useState(null);
  const[editingSession,setEditingSession]=useState(null);
  const[activeSession,setActiveSession]=useState(null);
  const[activeRoutine,setActiveRoutine]=useState(null);
  const[homeTab,setHomeTab]=useState('routines');

  useEffect(()=>{
    const d=loadData();
    setRoutines(d.routines);
    setSessions(d.sessions);
    setGroups(d.groups);
  },[]);
  useEffect(()=>{saveData({routines,sessions,groups});},[routines,sessions,groups]);

  const persistRoutine=(r,groupId)=>{
    setRoutines(p=>upsert(p,r));
    setGroups(p=>{
      const stripped=p.map(g=>({...g,routineIds:g.routineIds.filter(x=>x!==r.id)}));
      if(!groupId)return stripped;
      return stripped.map(g=>g.id===groupId?{...g,routineIds:[...g.routineIds,r.id]}:g);
    });
    setView('home');
  };
  const persistSession=s=>{
    setSessions(p=>upsert(p,s));
    setView('home');
  };
  const duplicateRoutine=r=>setRoutines(p=>[...p,{...clone(r),id:uid(),title:r.title+' (copy)'}]);
  const deleteRoutine=id=>{
    setRoutines(p=>p.filter(r=>r.id!==id));
    setSessions(p=>p.map(s=>({...s,routineIds:s.routineIds.filter(x=>x!==id)})));
    setGroups(p=>p.map(g=>({...g,routineIds:g.routineIds.filter(x=>x!==id)})));
  };
  const deleteSession=id=>setSessions(p=>p.filter(s=>s.id!==id));
  const addToSession=(sessId,routineId,add)=>{
    setSessions(p=>p.map(s=>s.id===sessId
      ?{...s,routineIds:add?[...s.routineIds.filter(x=>x!==routineId),routineId]:s.routineIds.filter(x=>x!==routineId)}
      :s));
  };
  const toggleCollapse=(id,v)=>setGroups(p=>p.map(g=>g.id===id?{...g,collapsed:v}:g));
  const newGroup=()=>setGroups(p=>[...p,{id:uid(),title:'New Group',routineIds:[]}]);
  const renameGroup=(id,title)=>setGroups(p=>p.map(g=>g.id===id?{...g,title}:g));
  const deleteGroup=id=>setGroups(p=>p.filter(g=>g.id!==id));
  const reorderGroups=newGroups=>setGroups(p=>{const rest=p.filter(g=>!newGroups.some(x=>x.id===g.id));return[...newGroups,...rest];});
  const reorderRoutines=(newUngrouped,groupedIds)=>setRoutines(p=>{const grouped=p.filter(r=>groupedIds.includes(r.id));return[...grouped,...newUngrouped];});

  if(view==='editRoutine')return h(EditRoutineView,{routine:editingRoutine,groups,onSave:persistRoutine,onBack:()=>setView('home')});
  if(view==='editSession')return h(EditSessionView,{session:editingSession,routines,onSave:persistSession,onBack:()=>setView('home')});
  if(view==='sessionDetail')return h(SessionDetailView,{session:activeSession,routines,onBack:()=>setView('home'),onStartRoutine:r=>{setActiveRoutine(r);setView('timer');}});
  if(view==='timer')return h(TimerView,{routine:activeRoutine,onBack:()=>setView(activeSession?'sessionDetail':'home')});
  return h(HomeView,{
    routines,sessions,groups,tab:homeTab,setTab:setHomeTab,
    onNewRoutine:()=>{setEditingRoutine(newTradRoutine());setView('editRoutine');},
    onEditRoutine:r=>{setEditingRoutine(clone(r));setView('editRoutine');},
    onDuplicateRoutine:duplicateRoutine,
    onDeleteRoutine:deleteRoutine,
    onPlayRoutine:r=>{setActiveSession(null);setActiveRoutine(r);setView('timer');},
    onAddToSession:addToSession,
    onNewSession:()=>{setEditingSession({id:uid(),name:'',routineIds:[]});setView('editSession');},
    onEditSession:s=>{setEditingSession(clone(s));setView('editSession');},
    onDeleteSession:deleteSession,
    onOpenSession:s=>{setActiveSession(s);setHomeTab('sessions');setView('sessionDetail');},
    onNewGroup:newGroup,onRenameGroup:renameGroup,onDeleteGroup:deleteGroup,onToggleCollapse:toggleCollapse,
    onReorderGroups:reorderGroups,onReorderRoutines:reorderRoutines,onReorderSessions:setSessions,
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
